# Scanner inputs — universe and per-candidate quality bars.

# Universe to scan each day.
# Expanded September 2026 per client request: the original 14-name
# defensive watchlist produced zero candidates for two straight weeks in
# a quiet market. This is now a broad liquid optionable universe (~60
# names): major index ETFs, all sector SPDRs, and the most liquid
# optionable large caps across sectors. Names still have to pass every
# quality filter below; a bigger funnel, not a lower bar.
# Note: scanning "every stock in the market" is neither feasible on free
# Yahoo data (rate limits) nor useful — option liquidity concentrates in
# a few hundred names, and the illiquid rest fails the spread/OI gates
# anyway. This list covers where premium-selling is actually tradeable.
universe:
  index_etfs:
    - SPY
    - QQQ
    - IWM
    - DIA
    - XLE
    - XLF
    - XLI
    - XLK
    - XLP
    - XLU
    - XLV
    - XLY
    - XLB
    - SMH
    - XBI
    - GLD
    - TLT
    - EEM
  equities:
    # Mega-cap tech / high option volume
    - AAPL
    - MSFT
    - NVDA
    - AMZN
    - GOOGL
    - META
    - TSLA
    - AMD
    - AVGO
    - NFLX
    - ORCL
    - CRM
    - QCOM
    - MU
    - INTC
    # Financials
    - JPM
    - BAC
    - WFC
    - GS
    - MS
    - SCHW
    # Healthcare
    - JNJ
    - UNH
    - PFE
    - MRK
    - ABBV
    - LLY
    # Consumer / defensives (the original income names stay)
    - PG
    - KO
    - PEP
    - WMT
    - MCD
    - CL
    - COST
    - HD
    - NKE
    - SBUX
    - DIS
    # Industrials / energy
    - XOM
    - CVX
    - CAT
    - BA
    - GE
    - HON
    - UPS
    # Telecom
    - T
    - VZ

# IV filters — premium-selling needs adequate IV but not panic-level.
iv:
  min: 0.15        # 15% annualized IV floor
  max: 0.80        # above this, structure breaks become too likely
  iv_rank_min: 0.30  # if IV-rank is computable, prefer >= 30th pctile

# Liquidity / quality gates.
liquidity:
  max_bid_ask_spread_pct: 0.10   # (ask - bid) / mid <= 10%
  min_open_interest: 100
  min_volume: 10
  min_underlying_dollar_volume: 5_000_000

# Technical compression — favor names whose realized vol has tightened.
compression:
  enabled: true
  bb_period: 20
  bb_width_compression_pct: 0.65
  atr_period: 14
  atr_compression_lookback: 50
  atr_compression_pct: 0.75   # current ATR <= 75% of trailing avg

# Output sizing.
output:
  max_candidates_per_run: 25
  # If fewer than min_candidates qualify, return what we have. We never
  # lower the quality bar to hit a minimum count.
  prefer_quality_over_quantity: true
