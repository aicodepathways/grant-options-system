name: Daily snapshot

on:
  schedule:
    # GitHub's cron queue routinely starts jobs 30-120 minutes late, so a
    # single morning run left the client reading yesterday's snapshot.
    # Schedule several refreshes across the morning (times are UTC;
    # Pacific during daylight time is UTC-7). Weekdays only.
    - cron: "45 13 * * 1-5"   # ~6:45 AM PT target
    - cron: "15 14 * * 1-5"   # ~7:15 AM PT
    - cron: "0 15 * * 1-5"    # ~8:00 AM PT
    - cron: "30 16 * * 1-5"   # ~9:30 AM PT
    - cron: "0 19 * * 1-5"    # ~12:00 PM PT midday refresh
  workflow_dispatch: {}

permissions:
  contents: write

# Refreshes can queue up behind GitHub delays; never let two runs push
# concurrently.
concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline and write snapshot
        env:
          OPTIONS_NOCACHE: "1"
        run: python scripts/publish_snapshot.py

      - name: Commit snapshot
        if: always()
        run: |
          git config user.name "snapshot-bot"
          git config user.email "actions@github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "Daily snapshot $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi
