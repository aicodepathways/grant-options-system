name: Daily snapshot

on:
  schedule:
    # GitHub not only delays scheduled runs, it silently SKIPS most of
    # them under load — observed behavior: with five slots defined,
    # exactly one fired per day at a random time, and some days none
    # fired before market morning. Dense half-hour slots through the
    # morning maximize the odds that at least one fires early. Times are
    # UTC; Pacific during daylight time is UTC-7. Weekdays only.
    - cron: "0,30 13-16 * * 1-5"   # every 30 min, 6:00-9:30 AM PT window
    - cron: "0 18 * * 1-5"          # ~11:00 AM PT
    - cron: "0 20 * * 1-5"          # ~1:00 PM PT
  workflow_dispatch: {}

permissions:
  contents: write

# Refreshes can queue up behind GitHub delays; never let two runs push
# concurrently.
concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline and write snapshot
        env:
          OPTIONS_NOCACHE: "1"
        run: python scripts/publish_snapshot.py

      - name: Commit snapshot
        if: always()
        run: |
          git config user.name "snapshot-bot"
          git config user.email "actions@github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "Daily snapshot $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi
